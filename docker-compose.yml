services:
  postgres:
    image: postgres:16-alpine
    container_name: research-agent-postgres

    environment:
      POSTGRES_DB: research_agent
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research

    ports:
      - "5433:5432"

    volumes:
      - research_agent_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U research -d research_agent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: research-agent-redis

    ports:
      - "6380:6379"

    volumes:
      - research_agent_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .

    container_name: research-agent-api

    env_file:
      - .env

    environment:
      APP_ENV: production

      POSTGRES_URI: >-
        postgresql://research:research@postgres:5432/research_agent?sslmode=disable

      REDIS_URL: >-
        redis://redis:6379/0

    ports:
      - "8001:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


volumes:
  research_agent_postgres_data:
  research_agent_redis_data: